<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnitrix</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="omnitrix-container">

        <h1>OMNITRIX</h1>

        <section class="omnitrix">

            <!-- Botão esquerdo -->
            <button class="arrow left" id="previous">
                ◀
            </button>

            <!-- Visor central -->
            <div class="display">

                <div class="alien-icon" id="alienIcon">
                    👽
                </div>

                <h2 id="alienName">
                    CHAMA
                </h2>

                <p id="alienDescription">
                    Alienígena de energia e fogo.
                </p>

            </div>

            <!-- Botão direito -->
            <button class="arrow right" id="next">
                ▶
            </button>

        </section>

        <button class="transform-button" id="transform">
            TRANSFORMAR
        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
